<div class="l-bar__space-keeper c-listing-property">
    <!-- BEGIN property -->
    <div class="l-bar__group c-listing-property__property">
        <!-- BEGIN label -->
        <span class="l-bar__element c-listing-property__propertylabel<!-- BEGIN has_symbol --> c-listing-property__propertylabel--symbol<!-- END has_symbol -->">{LABEL}</span>
        <!-- END label -->
        <span class="l-bar__element c-listing-property__propertyvalue t-text-more-less">
            <span class="t-text-more-less__text-body">{VALUE}</span><!-- BEGIN long_value --> <input class="t-text-more-less__toggle" type="checkbox" id="{ID_SHOW_MORE_TOGGLE}"> <label class="t-text-more-less__label" for="{ID_SHOW_MORE_TOGGLE}"><span class="t-text-more-less__label__more">{MORE}</span><span class="t-text-more-less__label__less">{LESS}</span></label><!-- END long_value -->
        </span>
    </div>
    <!-- END property -->
</div>
